version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: blog-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-blog_api}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
